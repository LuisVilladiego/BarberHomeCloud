        <button class="user" type="button">
          <span class="user__avatar" aria-hidden="true">?</span>
          <span class="user__name">Tu cuenta</span>
        </button>
      </aside>

      <main class="main main--calendar">
        <header class="gcal-toolbar">
          <div class="gcal-toolbar__left">
            <label class="gcal-source-select">
              <span class="sr-only">Calendario</span>
              <select id="gcal-source" aria-label="Seleccionar calendario"></select>
            </label>
            <label class="gcal-month-select">
              <span class="sr-only">Mes</span>
              <select id="gcal-month" aria-label="Seleccionar mes"></select>
            </label>
          </div>
          <div class="gcal-toolbar__right">
            <button class="icon-btn" type="button" id="btn-gcal-filter" aria-label="Filtros" title="Filtros">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="gcal-nav">
              <button class="icon-btn" type="button" id="btn-gcal-prev" aria-label="Semana anterior">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m14 7-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button class="btn btn--secondary btn--sm" type="button" id="btn-gcal-today">Hoy</button>
              <button class="icon-btn" type="button" id="btn-gcal-next" aria-label="Semana siguiente">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m10 7 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <button class="btn btn--secondary btn--sm" type="button" id="btn-gcal-view">
              Vista semana
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="btn btn--primary btn--sm" type="button" id="btn-new-appt">+ Cita</button>
            <button class="icon-btn" type="button" aria-label="Más opciones">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                <circle cx="18" cy="12" r="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </header>

        <section class="gcal" aria-label="Calendario semanal">
          <div class="gcal__head" id="gcal-head"></div>
          <div class="gcal__body" id="gcal-body"></div>
        </section>
      </main>

      <a class="help" href="https://wa.me/" target="_blank" rel="noreferrer">
        <span class="help__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff">
            <path d="M12 2.1A9.9 9.9 0 0 0 3.3 17L2 22l5.2-1.3A9.9 9.9 0 1 0 12 2.1Zm5.5 14.1c-.2.7-1.3 1.2-2.1 1.4-.6.1-1.3.2-3.7-.8-3.1-1.3-5.1-4.5-5.2-4.7-.2-.2-1.2-1.6-1.2-3.1 0-1.4.8-2.2 1.1-2.4.3-.3.7-.3.9-.3h.7c.2 0 .5-.1.7.6.3.8.9 2.1 1 2.3.1.1.1.3 0 .5l-.5.7c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.2.4-.2.7-.1l2.1 1c.3.1.4.3.4.4 0 .3 0 1.4-.3 2.1Z"/>
          </svg>
        </span>
        ¿Necesitas ayuda?
      </a>
    </div>

    <div class="modal" id="appt-modal" hidden>
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="appt-modal-title">
        <header class="modal__head">
          <h2 id="appt-modal-title">Crear cita</h2>
          <button class="icon-btn" type="button" data-close-modal aria-label="Cerrar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <form id="appt-form" class="modal__body">
          <p class="appt-slot-summary" id="appt-slot-summary"></p>
          <label class="field">
            <span class="field__label">Cliente</span>
            <input name="name" id="appt-name" type="text" required placeholder="Nombre del cliente" autocomplete="name" />
          </label>
          <label class="field">
            <span class="field__label">WhatsApp</span>
            <input name="phone" id="appt-phone" type="tel" required placeholder="3116962326" />
          </label>
          <label class="field">
            <span class="field__label">Servicio</span>
            <select name="serviceId" id="appt-service" required></select>
          </label>
          <label class="field">
            <span class="field__label">Fecha</span>
            <input name="date" id="appt-date" type="date" required />
          </label>
          <label class="field">
            <span class="field__label">Hora</span>
            <input name="time" id="appt-time" type="time" required step="1800" />
          </label>
          <label class="field">
            <span class="field__label">Notas (opcional)</span>
            <textarea name="notes" id="appt-notes" rows="2" placeholder="Notas internas"></textarea>
          </label>
          <p class="auth-error" id="appt-error" hidden></p>
          <div class="modal__actions">
            <button class="btn btn--secondary" type="button" data-close-modal>Cancelar</button>
            <button class="btn btn--primary" type="submit" id="appt-submit">Guardar cita</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="appt-detail-modal" hidden>
      <div class="modal__backdrop" data-close-detail></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="appt-detail-title">
        <header class="modal__head">
          <h2 id="appt-detail-title">Detalle de cita</h2>
          <button class="icon-btn" type="button" data-close-detail aria-label="Cerrar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="modal__body" id="appt-detail-body"></div>
        <div class="modal__actions">
          <button class="btn btn--primary" type="button" id="btn-complete-appt">Marcar completada</button>
          <button class="btn btn--danger-soft" type="button" id="btn-cancel-appt">Cancelar cita</button>
          <button class="btn btn--secondary" type="button" data-close-detail>Cerrar</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>
    <button class="menu-toggle" type="button" aria-label="Abrir menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
