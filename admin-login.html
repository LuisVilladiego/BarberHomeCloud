<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin · BarberCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260901g" />
    <link rel="stylesheet" href="css/admin.css?v=20260822d" />
    <meta name="robots" content="noindex, nofollow" />
    <script src="js/admin-session.js?v=20260822d"></script>
    <script>
      (function () {
        var session = window.AdminSession && window.AdminSession.readAdminSession();
        if (session) location.replace("admin.html");
      })();
    </script>
  </head>
  <body class="tutorial-body auth-page">
    <main class="admin-gate">
      <div class="admin-gate__card">
        <div class="tutorial-card__brand" style="justify-content:center;margin-bottom:1rem">
          <img src="assets/logo.png" alt="" width="28" height="28" />
          <strong>BarberCloud Admin</strong>
        </div>
        <h1>Acceso de plataforma</h1>
        <p class="tutorial-card__lead">Solo el administrador del SaaS puede entrar aquí.</p>
        <p class="auth-error" id="admin-login-error" hidden></p>
        <button class="btn btn--google-primary btn--block" type="button" id="admin-login-google">
          <span class="btn--google-primary__badge" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </span>
          Entrar con Google
        </button>
        <p class="auth-help" style="text-align:center;margin:0.75rem 0">o con contraseña (si ya la configuraste en Supabase)</p>
        <form class="form auth-form" id="admin-login-form">
          <label class="field">
            <span class="field__label">Correo administrador</span>
            <input id="admin-email" name="email" type="email" value="adminbarbercloud@gmail.com" readonly />
          </label>
          <label class="field">
            <span class="field__label">Contraseña</span>
            <input name="password" type="password" minlength="6" autocomplete="current-password" placeholder="Solo si configuraste contraseña en Supabase" />
          </label>
          <button class="btn btn--primary btn--block" type="submit" id="admin-login-submit">Entrar al panel</button>
        </form>
        <p style="margin-top:1rem;text-align:center">
          <a class="auth-help__link" href="landing.html">← Volver al sitio público</a>
        </p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/admin-login.js?v=20260824a"></script>
  </body>
</html>
