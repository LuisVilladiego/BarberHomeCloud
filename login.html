<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Entrar · BarberCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260818auth" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  </head>
  <body class="tutorial-body auth-page">
    <main class="tutorial-shell">
      <div class="tutorial-card tutorial-card--page tutorial-card--auth">
        <div class="tutorial-card__brand">
          <img src="assets/logo.png" alt="" width="28" height="28" />
          <strong>BarberCloud</strong>
        </div>
        <h1 id="login-title">Crea tu cuenta</h1>
        <p class="tutorial-card__lead" id="login-lead">
          Gestiona citas, clientes y reservas de tu barbería. Es súper fácil, tomará 2 minutos.
        </p>

        <p class="auth-error" id="login-error" hidden></p>

        <div class="auth-hub" id="auth-hub">
          <div class="auth-hub__stack">
            <button class="btn btn--google-primary btn--block" type="button" id="btn-google-auth">
              <span class="btn--google-primary__badge" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 5.71 1.52 7.03 2.79l5.13-5.01C33.64 4.51 29.28 3 24 3 14.82 3 6.73 8.48 3.45 16.97l6.02 4.67C10.9 14.56 16.92 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.42-4.74H24v9.01h12.67c-.55 2.95-2.21 5.45-4.71 7.13l7.3 5.66C43.98 37.13 46.5 31.28 46.5 24.5z"/>
                  <path fill="#FBBC05" d="M10.47 28.09a14.5 14.5 0 0 1 0-8.18l-6.02-4.67a23.93 23.93 0 0 0 0 21.52l6.02-4.67z"/>
                  <path fill="#34A853" d="M24 45c5.28 0 9.72-1.74 12.96-4.74l-7.3-5.66c-2.03 1.36-4.63 2.17-5.66 2.17-7.08 0-13.1-4.78-15.26-11.23l-6.02 4.67C6.73 39.52 14.82 45 24 45z"/>
                </svg>
              </span>
              <span id="google-auth-label">Crear cuenta con Gmail</span>
            </button>
            <button class="btn btn--email-outline btn--block" type="button" id="btn-email-auth">
              <svg class="btn--email-outline__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 4-8 5L4 8V6l8 5 8-5z"/>
              </svg>
              <span id="email-auth-label">Crear cuenta con email y contraseña</span>
            </button>
          </div>
          <p class="auth-hub__switch">
            <span id="auth-switch-lead">¿Ya tienes cuenta?</span>
            <button type="button" class="auth-hub__switch-btn" id="btn-auth-switch">Entrar</button>
          </p>
        </div>

        <div class="auth-email" id="auth-email-panel" hidden>
          <button type="button" class="auth-email__back" id="auth-email-back">← Volver</button>

          <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tabs__btn" data-auth-mode="login">Entrar</button>
            <button type="button" class="auth-tabs__btn is-active" data-auth-mode="signup">Crear cuenta</button>
          </div>

          <form class="form auth-form" id="login-form">
            <label class="field" id="field-name" hidden>
              <span class="field__label">Tu nombre</span>
              <input name="name" type="text" autocomplete="name" placeholder="Luis Villadiego" />
            </label>
            <label class="field">
              <span class="field__label">Correo</span>
              <input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com" />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input name="password" type="password" required minlength="6" autocomplete="new-password" />
            </label>
            <p class="auth-help" id="forgot-wrap" hidden>
              <button type="button" class="auth-help__link" id="btn-forgot">¿Olvidaste tu contraseña?</button>
            </p>
            <div class="tutorial-card__actions tutorial-card__actions--stack">
              <button class="btn btn--primary btn--block" type="submit" id="login-submit">Crear cuenta</button>
            </div>
          </form>
        </div>

        <form class="form auth-form" id="recover-request-form" hidden>
          <button type="button" class="auth-email__back" id="recover-back">← Volver</button>
          <label class="field">
            <span class="field__label">Correo</span>
            <input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com" />
          </label>
          <p class="auth-error" id="recover-request-error" hidden></p>
          <div class="tutorial-card__actions tutorial-card__actions--stack">
            <button class="btn btn--primary btn--block" type="submit" id="recover-send">Enviar código</button>
          </div>
        </form>

        <form class="form auth-form" id="recover-reset-form" hidden>
          <button type="button" class="auth-email__back" id="recover-reset-back">← Volver</button>
          <label class="field">
            <span class="field__label">Código de 6 dígitos</span>
            <input
              name="code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="000000"
              required
            />
          </label>
          <div class="verify-demo" id="recover-demo" hidden>
            <strong>Código de respaldo:</strong>
            <code id="recover-demo-code"></code>
          </div>
          <label class="field">
            <span class="field__label">Nueva contraseña</span>
            <input name="password" type="password" required minlength="6" autocomplete="new-password" />
          </label>
          <label class="field">
            <span class="field__label">Confirmar contraseña</span>
            <input name="passwordConfirm" type="password" required minlength="6" autocomplete="new-password" />
          </label>
          <p class="auth-error" id="recover-reset-error" hidden></p>
          <div class="tutorial-card__actions tutorial-card__actions--stack">
            <button class="btn btn--primary btn--block" type="submit">Guardar contraseña</button>
          </div>
        </form>

        <form class="form auth-form" id="verify-form" hidden>
          <button type="button" class="auth-email__back" id="verify-back">← Volver</button>
          <label class="field">
            <span class="field__label">Código de 6 dígitos</span>
            <input
              name="code"
              id="verify-code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="000000"
            />
          </label>
          <p class="auth-notice" id="verify-lead">
            Revisa tu bandeja de entrada y el spam. El código caduca en 10 minutos.
          </p>
          <div class="verify-demo" id="verify-demo" hidden>
            <strong>Código de respaldo:</strong>
            <code id="verify-demo-code"></code>
          </div>
          <p class="auth-error" id="verify-error" hidden></p>
          <div class="tutorial-card__actions tutorial-card__actions--stack">
            <button class="btn btn--primary btn--block" type="submit" id="verify-submit">Verificar</button>
          </div>
          <button class="btn btn--email-outline btn--block" type="button" id="verify-resend">
            Reenviar código
          </button>
        </form>
      </div>
    </main>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/google-config.js"></script>
    <script src="js/google-auth.js?v=20260819a"></script>
    <script src="js/email-config.js?v=20260818h"></script>
    <script src="js/email-service.js?v=20260818e"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=20260816s"></script>
    <script src="js/supabase-client.js?v=20260818c"></script>
    <script src="js/tenant.js?v=20260818m"></script>
    <script src="js/supabase-data.js?v=20260818m"></script>
    <script src="js/business-model.js?v=20260822"></script>
    <script src="js/plans.js?v=20260818m"></script>
    <script src="js/billing.js?v=20260818m"></script>
    <script src="js/auth.js?v=20260819a"></script>
    <script src="js/login.js?v=20260818m"></script>
  </body>
</html>
